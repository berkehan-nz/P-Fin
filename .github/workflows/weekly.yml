# HAFTALIK — pazar. SEC toplu ceyreklik verisini gunceller ve YENI TARAMA TURU
# baslatir.
#
# Tam evren taramasini artik bu is akisi DEGIL, saatlik `scan.yml` yapiyor.
# Buranin isi: (1) yeni ceyrek verisi geldiyse indirmek, (2) evren listesini
# tazeleyip kuyrugu bastan kurmak.
name: Weekly (SEC toplu veri + yeni tur)

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finans-veri
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: SEC toplu veri onbellegi
        uses: actions/cache@v4
        with:
          path: .cache
          key: finans-cache-${{ github.run_id }}
          restore-keys: finans-cache-

      - name: Toplu veriyi senkronize et
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret'i tanimli degil."
            exit 1
          fi
          python - <<'PY'
          from src.sources import edgar_bulk
          yeni = edgar_bulk.sync()
          print("Yeni ceyrek:", yeni or "yok")
          edgar_bulk.prune()
          print("Onbellek:", edgar_bulk.cache_stats())
          PY

      - name: Yeni tarama turu baslat
        env:
          SEC_USER_AGENT:  ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: python -m src.run_scan --new-cycle --batch 60

      - name: Ozet
        if: always()
        run: python -m src.run_scan --status >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Commit
        run: |
          git config user.name  "berkehan-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "veri: haftalik SEC senkronu + yeni tarama turu $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
