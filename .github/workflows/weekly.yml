# HAFTALIK — pazar. SEC toplu ceyreklik verisini gunceller ve YENI TARAMA TURU
# baslatir.
#
# Tam evren taramasini artik bu is akisi DEGIL, saatlik `scan.yml` yapiyor.
# Buranin isi: (1) yeni ceyrek verisi geldiyse indirmek, (2) evren listesini
# tazeleyip kuyrugu bastan kurmak.
name: Weekly (SEC toplu veri + yeni tur)

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finans-veri
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: SEC toplu veri onbellegi
        uses: actions/cache@v4
        with:
          path: .cache
          key: finans-cache-${{ github.run_id }}
          restore-keys: finans-cache-

      - name: Toplu veriyi senkronize et
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret'i tanimli degil."
            exit 1
          fi
          python - <<'PY'
          from src.sources import edgar_bulk
          yeni = edgar_bulk.sync()
          print("Yeni ceyrek:", yeni or "yok")
          edgar_bulk.prune()
          print("Onbellek:", edgar_bulk.cache_stats())
          PY

      # DIKKAT: burada --new-cycle KULLANILMAZ.
      # Bir tarama turu ~5-10 gun suruyor (GitHub zamanlanmis kosulari saatte
      # bir degil, gunde 6-7 kez tetikliyor). Her pazar yeni tur baslatmak
      # yarim kalan taramayi cope atiyor ve tur HIC BITMIYORDU.
      # Yeni tur, mevcut tur bittiginde scan.run icinde kendiliginden baslar.
      - name: Tarama partisi (mevcut turu surdurur)
        env:
          SEC_USER_AGENT:  ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python -m src.run_scan

      - name: Ozet
        if: always()
        run: python -m src.run_scan --status >> $GITHUB_STEP_SUMMARY 2>&1 || true

      # ILERLEME HER HALUKARDA KAYDEDILMELI. 22 Eylul 2026'da parti adimi
      # 50 dakikalik sinira carpti; bu adim ATLANDI ve tarama imleci hic
      # ilerlemedi. Her saat ayni sirkette ayni yere takildi. `always()`
      # iptal durumunda da calisir; yarim parti bile kayittir.
      - name: Commit
        if: always()
        run: |
          scripts/commit_data.sh "veri: haftalik SEC senkronu + yeni tarama turu $(date -u +%Y-%m-%d)" data/
