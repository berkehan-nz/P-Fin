# NABIZ — genel bakis sayfasini canli tutan hafif kosu.
#
# Gunluk kosu her karti yeniden isler ve dakikalar surer; saatte bir
# calistirilamaz. Bu kosu yalnizca piyasa goruntusu, haber ve takvim ceker;
# kartlara dokunmaz. 1-2 dakika surer.
#
# GERCEKCI BEKLENTI: cron saatlik kurulu ama GitHub zamanlanmis is akislarini
# EN IYI CABAYLA calistirir ve yogunlukta atlar; olculen ortalama ~3-4 saat.
# Pano generated_at damgasini gosterir, tazelik tahmin edilmez.
name: Pulse (piyasa nabzi)

on:
  schedule:
    - cron: '10 * * * *'        # her saatin 10. dakikasi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finans-nabiz          # veri hattiyla AYRI grup: nabiz kartlara
  cancel-in-progress: false    # dokunmadigi icin paralel calisabilir

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Onbellek (SEC submissions + fiyat)
        uses: actions/cache@v4
        with:
          path: .cache
          key: finans-cache-${{ github.run_id }}
          restore-keys: finans-cache-

      - name: Nabiz
        env:
          SEC_USER_AGENT:  ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: python -m src.run_pulse

      - name: Commit
        run: |
          scripts/commit_data.sh "veri: nabiz $(date -u +'%Y-%m-%d %H:%M')" data/pulse.json data/macro.json
