# TUM KARTLARI YENIDEN HESAPLA — veri cikarma veya puanlama mantigi
# degistiginde elle calistirilir. Kaynak ve yazili bolumler korunur.
name: Rebuild (kartlari yeniden hesapla)

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Alt kume (virgulle, bos = tum kartlar)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: finans-veri
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Onbellek
        uses: actions/cache@v4
        with:
          path: .cache
          key: finans-cache-${{ github.run_id }}
          restore-keys: finans-cache-
      - name: Yeniden hesapla
        env:
          SEC_USER_AGENT:  ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.tickers }}" ] && ARGS="--tickers ${{ inputs.tickers }}"
          python -m src.run_rebuild $ARGS
      - name: Tutarlilik denetimi
        run: python scripts/audit_cards.py || true
      - name: Commit
        run: |
          scripts/commit_data.sh "veri: kartlar yeniden hesaplandi $(date -u +'%Y-%m-%d %H:%M')" data/
