name: Sabah Turu

# §3.2/§4: Günde 1 derin tur. Hafta içi ~08:00 TR (05:00 UTC).
# GitHub cron gecikebilir; bu kabul edilmiş bir sınırdır (§3.1).
on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:            # elle tetikleme (Adım 3: ilk maili gör)

permissions:
  contents: write               # state.json'ı geri commit'lemek için

concurrency:
  group: pfin-morning
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: state.json yoksa oluştur
        run: |
          if [ ! -f state.json ]; then
            PYTHONPATH=src python -m pfin.cli init-state --cash 50000
          fi

      - name: Sabah turu
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: PYTHONPATH=src python -m pfin.cli morning-run --out out

      - name: Brifingi artefakt olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: state.json'ı commit'le (§3.4 hafıza korunur)
        run: |
          git config user.name  "pfin-bot"
          git config user.email "pfin-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json değişmedi"
          else
            git commit -m "chore: sabah turu state güncellemesi [skip ci]"
            git push
          fi
