# MCP SUNUCUSUNU DAGIT — Claude sohbetinin sisteme baglandigi kopru.
#
# Neden var: MCP sunucusu (Cloudflare Worker) eskiden yalnizca bir
# bilgisayardan terminalle dagitilabiliyordu (npm run deploy). Bu, kod
# depoda guncellense bile canlidaki surumun eski kalmasi demekti ve bunu
# kimse fark etmiyordu. Artik mcp/ altinda bir degisiklik main'e girince
# kendiliginden dagitilir.
#
# TEK SEFERLIK KURULUM: depo ayarlarina CLOUDFLARE_API_TOKEN secret'i
# eklenmeli. Nasil yapilacagi README'de adim adim yazili.
name: MCP dagitimi

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      # Bu adim checkout'tan ONCE calisir; mcp/ klasoru henuz yok. Varsayilan
      # calisma klasoru (mcp) burada kullanilirsa adim anlamli hata yerine
      # "No such file or directory" ile cokuyordu.
      - name: Anahtar tanimli mi?
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret'i tanimli degil. MCP sunucusu dagitilamadi."
            echo "::error::Cozum: mcp/README.md > 'Dagitim — otomatik' > 'Tek seferlik kurulum' (3 adim)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      # Tip hatasi olan kod CANLIYA GITMEMELI. Hatali bir surum, calisan
      # bir surumun yerine gecerse Claude sohbeti sistemle baglantisini
      # tamamen kaybeder.
      - name: Tip denetimi
        run: npm run type-check

      - name: Dagit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Birden fazla Cloudflare hesabi varsa gerekir; yoksa bos kalabilir.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Ozet
        if: success()
        run: |
          {
            echo "### MCP sunucusu dagitildi"
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\`"
            echo ""
            echo "**Simdi:** claude.ai > Settings > Connectors > P-Fin > Disconnect > Connect,"
            echo "sonra YENI bir sohbet ac (eski sohbet yeni araclari gormez)."
            echo ""
            echo "Dogrulamak icin yeni sohbette: **whoami** aracini cagir."
          } >> "$GITHUB_STEP_SUMMARY"
