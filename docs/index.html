<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P-Fin</title>
<meta name="description" content="P-Fin — portföy, aday tarama ve piyasa takibi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<!-- Parola ekranı: <head>'de, içerik çizilmeden önce kilitler. -->
<script src="js/auth.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">P-Fin</div>
    <nav class="tabs" id="tabs" aria-label="Ana bölümler">
      <a href="#/bugun" data-screen="today">Bugün</a>
      <a href="#/portfoy" data-screen="portfolio">Portföy</a>
      <a href="#/adaylar" data-screen="candidates">Adaylar</a>
      <a href="#/piyasa" data-screen="market">Piyasa</a>
      <a href="#/huni" data-screen="funnel">Huni</a>
    </nav>
    <div class="topbar-tools">
      <button id="lockBtn" class="ghost icon-btn" title="Kilitle" aria-label="Kilitle" hidden>🔒</button>
      <button id="themeToggle" class="ghost icon-btn" title="Tema değiştir" aria-label="Tema değiştir">◐</button>
    </div>
  </div>
</header>

<main>
  <div id="loadError"></div>
  <section class="screen" id="screen-today"><div id="todayBody"></div></section>
  <section class="screen" id="screen-portfolio"><div id="portfolioBody"></div></section>
  <section class="screen" id="screen-candidates"><div id="candidatesBody"></div></section>
  <section class="screen" id="screen-market"><div id="marketBody"></div></section>
  <section class="screen" id="screen-funnel"><div id="funnelBody"></div></section>
  <section class="screen" id="screen-company"><div id="companyBody"></div></section>
</main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="js/data.js"></script>
<script src="js/format.js"></script>
<script src="js/charts.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/portfolio.js"></script>
<script src="js/views/weekly.js"></script>
<script src="js/views/candidates.js"></script>
<script src="js/views/company.js"></script>
<script src="js/views/market.js"></script>
<script src="js/views/funnel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
